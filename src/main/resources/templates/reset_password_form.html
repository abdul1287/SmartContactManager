<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base :: Layout(~{::section})">

<head>
    <meta charset="UTF-8">
    <title>Create New Password | Smart Contact Manager</title>
</head>

<body>
    <section class="py-5 relative-z d-flex align-items-center min-vh-100">

        <style>
            /* Glassmorphism Form Inputs */
            .glass-input {
                background: rgba(255, 255, 255, 0.03) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                color: #ffffff !important;
                border-radius: 8px;
                padding: 12px 15px;
                transition: all 0.3s ease;
            }

            .glass-input:focus {
                background: rgba(0, 229, 255, 0.05) !important;
                border-color: #00E5FF !important;
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.2) !important;
                outline: none;
            }

            .glass-input::placeholder {
                color: #6c757d;
            }

            .glass-label {
                color: #a0a5b5;
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: 600;
                margin-bottom: 8px;
                display: block;
            }

            /* Security Warning Button variant for password actions */
            .btn-neon-warning {
                color: #ffb300;
                border: 1px solid rgba(255, 179, 0, 0.4);
                background: rgba(255, 179, 0, 0.05);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .btn-neon-warning:hover {
                background: #ffb300;
                color: #0a0b10;
                box-shadow: 0 0 15px rgba(255, 179, 0, 0.6);
                border-color: #ffb300;
                transform: translateY(-2px);
            }

            /* Subtle Text Link */
            .glass-link {
                color: #a0a5b5;
                text-decoration: none;
                font-size: 0.9rem;
                transition: all 0.3s ease;
            }

            .glass-link:hover {
                color: #ffb300;
                /* Matches the warning theme of this page */
                text-shadow: 0 0 8px rgba(255, 179, 0, 0.4);
            }

            /* Neon Red Error Alert Styling */
            .glass-alert-danger {
                background: rgba(255, 51, 102, 0.1) !important;
                /* Deep transparent red */
                border: 1px solid rgba(255, 51, 102, 0.4) !important;
                color: #ff3366 !important;
                /* Neon red text */
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
                backdrop-filter: blur(10px);
                border-radius: 8px;
                font-weight: 500;
            }
        </style>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">

                    <div class="glass-card p-4 p-md-5 border-top-neon shadow-lg">

                        <div class="text-center mb-5">
                            <!-- Glowing Key Icon -->
                            <div class="mb-4 d-inline-flex align-items-center justify-content-center rounded-circle"
                                style="width: 70px; height: 70px; background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="#00E5FF"
                                    class="bi bi-key" viewBox="0 0 16 16">
                                    <path
                                        d="M0 8a4 4 0 0 1 7.465-2H14a.5.5 0 0 1 .354.146l1.5 1.5a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0L13 9.207l-.646.647a.5.5 0 0 1-.708 0L11 9.207l-.646.647a.5.5 0 0 1-.708 0L9 9.207l-.646.647A.5.5 0 0 1 8 10h-.535A4 4 0 0 1 0 8zm4-3a3 3 0 1 0 2.712 4.285A.5.5 0 0 1 7.163 9h.63l.853-.854a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.793-.793-1-1h-6.63a.5.5 0 0 1-.451-.285A3 3 0 0 0 4 5z" />
                                    <path d="M4 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0z" />
                                </svg>
                            </div>
                            <h2 class="fw-bold text-white mb-2">Create New Password</h2>
                            <p class="text-light-muted">OTP verified successfully. Please enter your new password below.
                            </p>
                        </div>

                        <div class="alert glass-alert-danger d-flex align-items-center" role="alert"
                            th:if="${message != null and message.type == 'alert-danger'}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-exclamation-triangle-fill me-3 flex-shrink-0" viewBox="0 0 16 16">
                                <path
                                    d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
                            </svg>
                            <span th:text="${message.content}"></span>
                        </div>

                        <!-- Form Starts Here -->
                        <form th:action="@{/reset-password-process}" method="POST">

                            <!-- NEW PASSWORD -->
                            <div class="mb-4 text-start">
                                <label for="newPassword" class="glass-label"><i
                                        class="bi bi-asterisk text-neon me-1"></i> New Password</label>
                                <input type="password" class="form-control glass-input" id="newPassword"
                                    name="newPassword" placeholder="Enter your new password" required>
                            </div>

                            <!-- CONFIRM NEW PASSWORD -->
                            <div class="mb-5 text-start">
                                <label for="confirmPassword" class="glass-label"><i
                                        class="bi bi-check2-all text-neon me-1"></i> Confirm Password</label>
                                <input type="password" class="form-control glass-input" id="confirmPassword"
                                    name="confirmPassword" placeholder="Confirm your new password" required>
                            </div>

                            <!-- Action Button -->
                            <div class="d-flex justify-content-center pt-2">
                                <button type="submit"
                                    class="btn btn-neon-warning px-5 py-2 fw-bold d-flex align-items-center rounded-3 w-100 justify-content-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                        class="bi bi-shield-lock-fill me-2" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd"
                                            d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5z" />
                                    </svg>
                                    Save New Password
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
