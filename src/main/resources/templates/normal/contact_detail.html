<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/base :: Layout(~{::section})">

<head>
    <meta charset="UTF-8">
    <title th:text="${contact.name} + ' - Smart Contact Manager'">View Contact</title>
</head>

<body>
    <section class="view-contact-detail-section py-4 relative-z">

        <style>
            /* Maintain exact same sidebar styles */
            .glass-sidebar {
                background: rgba(10, 11, 16, 0.4) !important;
                border-right: 1px solid rgba(0, 229, 255, 0.1);
                border-radius: 16px;
                backdrop-filter: blur(10px);
            }

            .sidebar-link {
                color: #a0a5b5;
                padding: 12px 20px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                gap: 15px;
                transition: all 0.3s ease;
                text-decoration: none;
                font-weight: 500;
                margin-bottom: 8px;
            }

            .sidebar-link:hover,
            .sidebar-link.active {
                background: rgba(0, 229, 255, 0.1);
                color: #00E5FF;
                border-left: 4px solid #00E5FF;
            }

            /* Profile Card Specific Styles */
            .profile-hero-img {
                width: 150px;
                height: 150px;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid rgba(0, 229, 255, 0.6);
                box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
                background-color: #1a1d24;
                padding: 4px;
                margin: 0 auto;
            }

            .detail-box {
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid rgba(255, 255, 255, 0.05);
                border-radius: 12px;
                padding: 15px 20px;
                display: flex;
                align-items: center;
                gap: 15px;
                transition: all 0.3s ease;
            }

            .detail-box:hover {
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(0, 229, 255, 0.2);
            }

            .detail-icon {
                font-size: 1.5rem;
                color: #00E5FF;
                background: rgba(0, 229, 255, 0.1);
                width: 45px;
                height: 45px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
            }

            /* Neon Danger Button Styles */
            .btn-neon-danger {
                color: #ff3366;
                border: 1px solid rgba(255, 51, 102, 0.4);
                background: rgba(255, 51, 102, 0.05);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .btn-neon-danger:hover {
                background: #ff3366;
                color: #ffffff;
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
                border-color: #ff3366;
                transform: translateY(-2px);
            }

            /* Scrollable Description Box */
            .scrollable-description {
                max-height: 180px;
                /* Limits the height to about 7-8 lines of text */
                overflow-y: auto;
                padding-right: 10px;
            }

            /* Custom Neon Webkit Scrollbar */
            .scrollable-description::-webkit-scrollbar {
                width: 6px;
            }

            .scrollable-description::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.02);
                border-radius: 10px;
            }

            .scrollable-description::-webkit-scrollbar-thumb {
                background: rgba(0, 229, 255, 0.3);
                /* Dim neon blue */
                border-radius: 10px;
            }

            .scrollable-description::-webkit-scrollbar-thumb:hover {
                background: rgba(0, 229, 255, 0.8);
                /* Bright neon blue on hover */
            }

            /* SweetAlert 1 Glassmorphism Theme */
            .glass-theme {
                background: rgba(15, 17, 26, 0.95) !important;
                border: 1px solid rgba(0, 229, 255, 0.2) !important;
                border-top: 3px solid #00E5FF !important;
                border-radius: 16px !important;
                backdrop-filter: blur(15px) !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.1) !important;
            }

            /* Fix Text Colors */
            .glass-theme .swal-title {
                color: #ffffff !important;
            }

            .glass-theme .swal-text {
                color: #a0a5b5 !important;
            }

            /* Style the Cancel Button */
            .glass-theme .swal-button--cancel {
                background: transparent !important;
                color: #a0a5b5 !important;
                border: 1px solid rgba(255, 255, 255, 0.2) !important;
                transition: all 0.3s ease;
            }

            .glass-theme .swal-button--cancel:hover {
                background: rgba(255, 255, 255, 0.05) !important;
                color: #ffffff !important;
            }

            /* Style the Delete (Danger) Button */
            .glass-theme .swal-button--danger {
                background: rgba(255, 51, 102, 0.15) !important;
                color: #ff3366 !important;
                border: 1px solid rgba(255, 51, 102, 0.4) !important;
                transition: all 0.3s ease;
            }

            .glass-theme .swal-button--danger:hover {
                background: #ff3366 !important;
                color: #ffffff !important;
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.6) !important;
            }

            /* Style the OK (Normal) Button */
            .glass-theme .swal-button--confirm:not(.swal-button--danger) {
                background: rgba(0, 229, 255, 0.15) !important;
                color: #00E5FF !important;
                border: 1px solid rgba(0, 229, 255, 0.4) !important;
                transition: all 0.3s ease;
            }

            .glass-theme .swal-button--confirm:not(.swal-button--danger):hover {
                background: #00E5FF !important;
                color: #0a0b10 !important;
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.6) !important;
            }

            /* Fix Icon background circle for dark mode */
            .glass-theme .swal-icon--warning {
                border-color: #ff3366 !important;
            }

            .glass-theme .swal-icon--warning__body,
            .glass-theme .swal-icon--warning__dot {
                background-color: #ff3366 !important;
            }
        </style>

        <div class="container-fluid px-lg-5">
            <div class="row g-4">

                <div class="col-lg-3 col-xl-2">
                    <div class="glass-sidebar p-3 h-100 min-vh-100">
                        <div class="text-center mb-4 pt-3">
                            <div class="rounded-circle bg-dark d-inline-flex align-items-center justify-content-center border border-info"
                                style="width: 80px; height: 80px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="var(--neon-blue)"
                                    class="bi bi-person-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                                </svg>
                            </div>
                            <h5 class="text-white mt-3 fw-bold" th:text="${user.name}">User Name</h5>
                            <p class="text-light-muted text-sm mb-2" style="font-size: 0.8rem;" th:text="${user.email}">
                                user@example.com</p>
                        </div>
                        <hr class="border-secondary opacity-25 mb-4">
                        <nav>
                            <a th:href="@{/user/dashboard}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-grid-1x2-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M0 1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1zm9 0a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V1zm0 9a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5z" />
                                </svg> Dashboard
                            </a>
                            <a th:href="@{/user/show_contacts/0}" class="sidebar-link active">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-people-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7Zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-5.784 6A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216ZM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
                                </svg> View Contacts
                            </a>
                            <a th:href="@{/user/add_contact}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-person-plus-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                                    <path fill-rule="evenodd"
                                        d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z" />
                                </svg> Add Contact
                            </a>
                        </nav>
                    </div>
                </div>

                <div class="col-lg-9 col-xl-10 mt-4 mt-lg-0">

                    <div class="row justify-content-center">
                        <div class="col-md-10 col-lg-8">

                            <div class="glass-card p-4 p-md-5 border-top-neon shadow-lg text-center mt-3"
                                th:if="${contact != null}">

                                <div class="position-relative d-inline-block mb-4">
                                    <div th:if="${#strings.isEmpty(contact.image) or contact.image == 'default.png'}"
                                        class="profile-hero-img d-flex align-items-center justify-content-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="#00E5FF"
                                            class="bi bi-person-fill" viewBox="0 0 16 16">
                                            <path
                                                d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                                        </svg>
                                    </div>
                                    <img th:unless="${#strings.isEmpty(contact.image) or contact.image == 'default.png'}"
                                        th:src="@{'/img/' + ${contact.image}}" alt="profile photo"
                                        class="profile-hero-img" />
                                </div>

                                <h1 class="fw-bold text-white mb-1" th:text="${contact.name}">Contact Name</h1>
                                <p class="text-neon fs-5 mb-1" th:if="${not #strings.isEmpty(contact.nickname)}"
                                    th:text="'(' + ${contact.nickname} + ')'">(Nickname)</p>
                                <p class="text-light-muted mb-4">SCM2026<span th:text="${contact.cId}"></span></p>

                                <hr class="border-secondary opacity-25 mb-4">

                                <div class="row g-3 text-start mb-4">

                                    <div class="col-12">
                                        <div class="detail-box">
                                            <div class="detail-icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                    fill="currentColor" class="bi bi-telephone" viewBox="0 0 16 16">
                                                    <path
                                                        d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122l-2.19.547a1.745 1.745 0 0 1-1.657-.459L5.482 8.062a1.745 1.745 0 0 1-.46-1.657l.548-2.19a.678.678 0 0 0-.122-.58L3.654 1.328zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z" />
                                                </svg>
                                            </div>
                                            <div>
                                                <small class="text-light-muted text-uppercase tracking-wide"
                                                    style="font-size: 0.75rem;">Phone</small>
                                                <div class="fw-bold text-white fs-6 mt-1" th:text="${contact.phone}">+1
                                                    234 567 890</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <div class="detail-box">
                                            <div class="detail-icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                    fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
                                                    <path
                                                        d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z" />
                                                </svg>
                                            </div>
                                            <div style="overflow-wrap: break-word; word-break: break-word;">
                                                <small class="text-light-muted text-uppercase tracking-wide"
                                                    style="font-size: 0.75rem;">Email</small>
                                                <div class="fw-bold text-white fs-6 mt-1" th:text="${contact.email}">
                                                    email@example.com</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12" th:if="${not #strings.isEmpty(contact.work)}">
                                        <div class="detail-box">
                                            <div class="detail-icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                    fill="currentColor" class="bi bi-briefcase" viewBox="0 0 16 16">
                                                    <path
                                                        d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1h-3zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5zm1.886 6.914L15 7.151V12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V7.15l6.614 1.764a1.5 1.5 0 0 0 .772 0zM1.5 4h13a.5.5 0 0 1 .5.5v1.616L8.129 7.948a.5.5 0 0 1-.258 0L1 6.116V4.5a.5.5 0 0 1 .5-.5z" />
                                                </svg>
                                            </div>
                                            <div>
                                                <small class="text-light-muted text-uppercase tracking-wide"
                                                    style="font-size: 0.75rem;">Work / Company</small>
                                                <div class="fw-bold text-white fs-6 mt-1" th:text="${contact.work}">
                                                    Software Engineer</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="text-start bg-dark bg-opacity-25 p-4 rounded-3 border border-secondary border-opacity-25 mb-4"
                                    th:if="${not #strings.isEmpty(contact.description)}">

                                    <h6 class="text-neon mb-3 d-flex align-items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                            fill="currentColor" class="bi bi-pencil-square me-2" viewBox="0 0 16 16">
                                            <path
                                                d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                                            <path fill-rule="evenodd"
                                                d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z" />
                                        </svg> Description
                                    </h6>

                                    <p class="text-light-muted mb-0 scrollable-description"
                                        th:text="${contact.description}">Description text goes here.</p>

                                </div>

                                <div class="d-flex justify-content-center gap-3 mt-5">

                                    <a th:href="@{/user/show_contacts/0}"
                                        class="btn btn-outline-secondary px-4 py-2 fw-bold border-0 d-flex align-items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                            fill="currentColor" class="bi bi-arrow-left me-2" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd"
                                                d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z" />
                                        </svg> Back
                                    </a>

                                    <a th:href="@{'/user/update-contact/'+${contact.cId}}"
                                        class="btn btn-neon px-4 py-2 fw-bold d-flex align-items-center">
                                        Edit
                                    </a>

                                    <a class="btn btn-neon-danger px-4 py-2 fw-bold d-flex align-items-center"
                                        th:onclick="|deleteContact(${contact.cId})|">
                                        Delete
                                    </a>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</body>

</html>
