<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/base :: Layout(~{::section})">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile | Smart Contact Manager</title>
</head>

<body>
    <section class="user-profile-section py-4 relative-z">

        <style>
            /* Sidebar Styles (Maintained for continuity) */
            .glass-sidebar {
                background: rgba(10, 11, 16, 0.4) !important;
                border-right: 1px solid rgba(0, 229, 255, 0.1);
                border-radius: 16px;
                backdrop-filter: blur(10px);
            }

            .sidebar-link {
                color: #a0a5b5;
                padding: 12px 20px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                gap: 15px;
                transition: all 0.3s ease;
                text-decoration: none;
                font-weight: 500;
                margin-bottom: 8px;
            }

            .sidebar-link:hover,
            .sidebar-link.active {
                background: rgba(0, 229, 255, 0.1);
                color: #00E5FF;
                border-left: 4px solid #00E5FF;
            }

            /* Image Preview Styles */
            .profile-hero-img {
                width: 130px;
                height: 130px;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid rgba(0, 229, 255, 0.6);
                box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
                background-color: #1a1d24;
                padding: 4px;
                margin: 0 auto;
                transition: all 0.3s ease;
            }

            /* Glassmorphism Form Inputs */
            .glass-input {
                background: rgba(255, 255, 255, 0.03) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                color: #ffffff !important;
                border-radius: 8px;
                padding: 12px 15px;
                transition: all 0.3s ease;
            }

            .glass-input:focus {
                background: rgba(0, 229, 255, 0.05) !important;
                border-color: #00E5FF !important;
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.2) !important;
                outline: none;
            }

            .glass-input::placeholder {
                color: #6c757d;
            }

            /* Custom File Input Styling */
            input[type="file"].glass-input {
                padding: 9px 15px;
                color: #a0a5b5 !important;
            }

            input[type="file"].glass-input::file-selector-button {
                background: rgba(0, 229, 255, 0.1);
                border: 1px solid rgba(0, 229, 255, 0.3);
                color: #00E5FF;
                padding: 6px 12px;
                border-radius: 4px;
                margin-right: 15px;
                transition: all 0.3s ease;
                cursor: pointer;
            }

            input[type="file"].glass-input::file-selector-button:hover {
                background: rgba(0, 229, 255, 0.2);
                box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            }

            /* Label Styles */
            .glass-label {
                color: #a0a5b5;
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: 600;
                margin-bottom: 8px;
                display: block;
            }

            /* Action Buttons */
            .btn-outline-cancel {
                color: #a0a5b5;
                border: 1px solid rgba(255, 255, 255, 0.2);
                background: transparent;
                transition: all 0.3s ease;
            }

            .btn-outline-cancel:hover {
                color: #ffffff;
                background: rgba(255, 255, 255, 0.05);
                border-color: rgba(255, 255, 255, 0.4);
            }

            /* Neon Red Error Alert Styling */
            .glass-alert-danger {
                background: rgba(255, 51, 102, 0.1) !important;
                /* Deep transparent red */
                border: 1px solid rgba(255, 51, 102, 0.4) !important;
                color: #ff3366 !important;
                /* Neon red text */
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
                backdrop-filter: blur(10px);
                border-radius: 8px;
                font-weight: 500;
            }

            /* Neon Green Success Alert Styling */
            .glass-alert-success {
                background: rgba(0, 230, 118, 0.1) !important;
                /* Deep transparent green */
                border: 1px solid rgba(0, 230, 118, 0.4) !important;
                color: #00E676 !important;
                /* Neon green text */
                box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
                backdrop-filter: blur(10px);
                border-radius: 8px;
                font-weight: 500;
            }

            /* Inline Form Validation Errors - Neon Red */
            .text-neon-red {
                color: #ff3366 !important;
                text-shadow: 0 0 5px rgba(255, 51, 102, 0.4);
                font-size: 0.85rem;
                font-weight: 500;
                margin-top: 6px;
                display: block;
            }

            /* Make the input border glow red when invalid */
            .glass-input.is-invalid {
                border-color: #ff3366 !important;
                box-shadow: 0 0 10px rgba(255, 51, 102, 0.2) !important;
            }

            .glass-input.is-invalid:focus {
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.4) !important;
            }
        </style>

        <div class="container-fluid px-lg-5">
            <div class="row g-4">

                <!-- 1. SIDEBAR NAVIGATION -->
                <div class="col-lg-3 col-xl-2">
                    <div class="glass-sidebar p-3 h-100 min-vh-100">
                        <div class="text-center mb-4 pt-3">
                            <div class="rounded-circle bg-dark d-inline-flex align-items-center justify-content-center border border-info"
                                style="width: 80px; height: 80px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="var(--neon-blue)"
                                    class="bi bi-person-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                                </svg>
                            </div>
                            <h5 class="text-white mt-3 fw-bold" th:text="${user.name}">User Name</h5>
                            <p class="text-light-muted text-sm mb-2" style="font-size: 0.8rem;" th:text="${user.email}">
                                user@example.com</p>
                        </div>
                        <hr class="border-secondary opacity-25 mb-4">
                        <nav>
                            <a th:href="@{/user/dashboard}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-grid-1x2-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M0 1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1zm9 0a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V1zm0 9a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5z" />
                                </svg> Dashboard
                            </a>
                            <a th:href="@{/user/show_contacts/0}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-people-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7Zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-5.784 6A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216ZM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
                                </svg> View Contacts
                            </a>
                            <a th:href="@{/user/add_contact}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-person-plus-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                                    <path fill-rule="evenodd"
                                        d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z" />
                                </svg> Add Contact
                            </a>
                            <a th:href="@{/user/profile}" class="sidebar-link active">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-person-circle" viewBox="0 0 16 16">
                                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                                    <path fill-rule="evenodd"
                                        d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z" />
                                </svg> Your Profile
                            </a>
                        </nav>
                    </div>
                </div>

                <!-- 2. MAIN CONTENT AREA (EDIT PROFILE FORM) -->
                <div class="col-lg-9 col-xl-10 mt-4 mt-lg-0">
                    <div class="row justify-content-center">
                        <div class="col-md-11 col-lg-8">

                            <div class="glass-card p-4 p-md-5 border-top-neon shadow-lg mt-3">

                                <div class="alert glass-alert-success d-flex align-items-center" role="alert"
                                    th:if="${message != null and message.type == 'alert-success'}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                        class="bi bi-check-circle-fill me-3 flex-shrink-0" viewBox="0 0 16 16">
                                        <path
                                            d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
                                    </svg>
                                    <span th:text="${message.content}"></span>
                                </div>

                                <div class="alert glass-alert-danger d-flex align-items-center" role="alert"
                                    th:if="${message != null and message.type == 'alert-danger'}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                        class="bi bi-exclamation-triangle-fill me-3 flex-shrink-0" viewBox="0 0 16 16">
                                        <path
                                            d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
                                    </svg>
                                    <span th:text="${message.content}"></span>
                                </div>
                                <div class="text-center mb-3">
                                    <h2 class="fw-bold text-white mb-1">Edit <span class="text-neon">Profile</span></h2>
                                    <p class="text-light-muted mb-0">Update your personal information below.</p>
                                </div>

                                <!-- Form Starts Here -->
                                <!-- Make sure th:action points to your backend controller method for saving -->
                                <form th:action="@{/user/profile/process-update-profile}" method="POST"
                                    enctype="multipart/form-data" th:object="${user}">

                                    <!-- Hidden input for User ID -->
                                    <input type="hidden" th:field="*{id}">

                                    <!-- Image Update Section -->
                                    <div class="text-center mb-4">
                                        <div th:if="${#strings.isEmpty(user.imageUrl)}"
                                            class="profile-hero-img d-flex align-items-center justify-content-center">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70"
                                                fill="#00E5FF" class="bi bi-person-fill" viewBox="0 0 16 16">
                                                <path
                                                    d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                                            </svg>
                                            <img th:unless="${#strings.isEmpty(user.imageUrl)}"
                                                th:src="@{'/img/' + ${user.imageUrl}}" alt="profile photo"
                                                class="profile-hero-img" />
                                        </div>

                                        <div class="d-flex justify-content-center">
                                            <div class="text-start" style="max-width: 350px;">
                                                <label for="profileImage" class="glass-label text-center"><i
                                                        class="bi bi-camera text-neon"></i> Update Profile
                                                    Picture</label>
                                                <!-- The onchange event triggers the preview script below -->
                                                <input type="file" class="form-control glass-input" id="profileImage"
                                                    name="profileImage" accept="image/jpeg,image/png,image/gif"
                                                    onchange="previewImage(event)">
                                            </div>
                                        </div>
                                    </div>

                                    <hr class="border-secondary opacity-25 mb-4">

                                    <!-- Name Input -->
                                    <div class="mb-4 text-start">
                                        <label for="name" class="glass-label"><i
                                                class="bi bi-person text-neon me-1"></i> Full Name</label>
                                        <input type="text" class="form-control glass-input" id="name" th:field="*{name}"
                                            placeholder="Enter your full name"
                                            th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">

                                        <span class="text-neon-red" th:if="${#fields.hasErrors('name')}"
                                            th:errors="*{name}">
                                        </span>
                                    </div>

                                    <!-- Email Input -->
                                    <div class="mb-4 text-start">
                                        <label for="email" class="glass-label"><i
                                                class="bi bi-envelope text-neon me-1"></i> Email Address</label>
                                        <input type="email" class="form-control glass-input" id="email"
                                            th:field="*{email}" placeholder="Enter your email address"
                                            th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">

                                        <span class="text-neon-red" th:if="${#fields.hasErrors('email')}"
                                            th:errors="*{email}">
                                        </span>
                                    </div>

                                    <!-- About Input -->
                                    <div class="mb-5 text-start">
                                        <label for="about" class="glass-label"><i
                                                class="bi bi-info-circle text-neon me-1"></i> About You</label>
                                        <textarea class="form-control glass-input" id="about" rows="4"
                                            th:field="*{about}" placeholder="Write a short bio about yourself..."
                                            th:classappend="${#fields.hasErrors('about')} ? ' is-invalid'">
</textarea>

                                        <span class="text-neon-red" th:if="${#fields.hasErrors('about')}"
                                            th:errors="*{about}">
                                        </span>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div
                                        class="d-flex justify-content-center gap-3 pt-3 border-top border-secondary border-opacity-25">
                                        <a th:href="@{/user/profile}"
                                            class="btn btn-outline-cancel px-4 py-2 fw-bold rounded-3">Cancel</a>

                                        <button type="submit"
                                            class="btn btn-neon px-5 py-2 fw-bold d-flex align-items-center rounded-3">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                fill="currentColor" class="bi bi-check2-circle me-2"
                                                viewBox="0 0 16 16">
                                                <path
                                                    d="M2.5 8a5.5 5.5 0 0 1 8.25-4.764.5.5 0 0 0 .5-.866A6.5 6.5 0 1 0 14.5 8a.5.5 0 0 0-1 0 5.5 5.5 0 1 1-11 0z" />
                                                <path
                                                    d="M15.354 3.354a.5.5 0 0 0-.708-.708L8 9.293 5.354 6.646a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l7-7z" />
                                            </svg> Save Changes
                                        </button>
                                    </div>

                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Script for Image Preview functionality -->
        <script>
            function previewImage(event) {
                const reader = new FileReader();
                reader.onload = function () {
                    const output = document.getElementById('imagePreview');
                    output.src = reader.result;
                };
                reader.readAsDataURL(event.target.files[0]);
            }
        </script>

    </section>
</body>

</html>
