<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/base :: Layout(~{::section})">

<head>
    <meta charset="UTF-8">
    <title>Add Contact - Smart Contact Manager</title>
</head>

<body>
    <section class="add-contact-section py-4 relative-z">

        <style>
            /* Sidebar Styles */
            .glass-sidebar {
                background: rgba(10, 11, 16, 0.4) !important;
                border-right: 1px solid rgba(0, 229, 255, 0.1);
                border-radius: 16px;
                backdrop-filter: blur(10px);
            }

            .sidebar-link {
                color: #a0a5b5;
                padding: 12px 20px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                gap: 15px;
                transition: all 0.3s ease;
                text-decoration: none;
                font-weight: 500;
                margin-bottom: 8px;
            }

            .sidebar-link:hover,
            .sidebar-link.active {
                background: rgba(0, 229, 255, 0.1);
                color: #00E5FF;
                border-left: 4px solid #00E5FF;
            }

            /* Form Styles */
            .glass-input {
                background: rgba(255, 255, 255, 0.03) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                color: #ffffff !important;
                padding: 12px 15px;
                transition: all 0.3s ease;
            }

            .glass-input:focus {
                background: rgba(255, 255, 255, 0.06) !important;
                border-color: #00E5FF !important;
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.2) !important;
                color: #ffffff !important;
                outline: none;
            }

            .glass-input::placeholder {
                color: #6c757d;
            }

            .form-label {
                color: #a0a5b5;
                font-weight: 600;
                font-size: 0.9rem;
                letter-spacing: 0.5px;
                margin-bottom: 8px;
            }

            /* Styling for the icon box attached to inputs */
            .glass-addon {
                background: rgba(0, 229, 255, 0.05) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                border-right: none !important;
                color: #00E5FF !important;
                display: flex;
                align-items: center;
                padding: 0 15px;
            }

            .input-group:focus-within .glass-addon {
                border-color: #00E5FF !important;
                box-shadow: -5px 0 15px rgba(0, 229, 255, 0.1) !important;
            }

            .input-group:focus-within .glass-input {
                border-left-color: transparent !important;
            }

            /* Glassmorphism File Upload Button Styling */
            .glass-input::file-selector-button {
                background: rgba(0, 229, 255, 0.1);
                color: #00E5FF;
                border: 1px solid rgba(0, 229, 255, 0.3);
                border-radius: 4px;
                padding: 6px 15px;
                margin-right: 15px;
                transition: all 0.3s ease;
                cursor: pointer;
                font-weight: 600;
            }

            .glass-input::file-selector-button:hover {
                background: var(--neon-blue);
                color: #000;
                box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
            }

            /* Neon Red Error Alert Styling */
            .glass-alert-danger {
                background: rgba(255, 51, 102, 0.1) !important;
                /* Deep transparent red */
                border: 1px solid rgba(255, 51, 102, 0.4) !important;
                color: #ff3366 !important;
                /* Neon red text */
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
                backdrop-filter: blur(10px);
                border-radius: 8px;
                font-weight: 500;
            }

            /* Neon Green Success Alert Styling */
            .glass-alert-success {
                background: rgba(0, 230, 118, 0.1) !important;
                /* Deep transparent green */
                border: 1px solid rgba(0, 230, 118, 0.4) !important;
                color: #00E676 !important;
                /* Neon green text */
                box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
                backdrop-filter: blur(10px);
                border-radius: 8px;
                font-weight: 500;
            }

            /* Inline Form Validation Errors - Neon Red */
            .text-neon-red {
                color: #ff3366 !important;
                text-shadow: 0 0 5px rgba(255, 51, 102, 0.4);
                font-size: 0.85rem;
                font-weight: 500;
                margin-top: 6px;
                display: block;
            }

            /* Make the input border glow red when invalid */
            .glass-input.is-invalid {
                border-color: #ff3366 !important;
                box-shadow: 0 0 10px rgba(255, 51, 102, 0.2) !important;
            }

            .glass-input.is-invalid:focus {
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.4) !important;
            }

            /* Profile Hero Image */
            .profile-hero-img {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid rgba(0, 229, 255, 0.6);
                box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
                background-color: #1a1d24;
                padding: 4px;
                margin: 0 auto;
            }
        </style>

        <div class="container-fluid px-lg-5">
            <div class="row g-4">

                <div class="col-lg-3 col-xl-2">
                    <div class="glass-sidebar p-3 h-100 min-vh-100">
                        <div class="text-center mb-4 pt-3">
                            <div class="rounded-circle bg-dark d-inline-flex align-items-center justify-content-center border border-info mb-3"
                                style="width: 80px; height: 80px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);"
                                th:if="${#strings.isEmpty(user.imageUrl)}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="var(--neon-blue)"
                                    class="bi bi-person-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                                </svg>
                            </div>
                            <img th:unless="${#strings.isEmpty(user.imageUrl)}" th:src="@{'/img/' + ${user.imageUrl}}"
                                alt="Profile Image" class="profile-hero-img" />
                            <h5 class="text-white fw-bold mb-1" th:text="${user.name}" style="padding-top: 4px;">User
                                Name</h5>
                            <p class="text-light-muted text-sm mb-2" style="font-size: 0.8rem;" th:text="${user.email}">
                                user@example.com</p>
                            <span class="badge badge-glass"
                                style="background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); color: var(--neon-blue); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem;">Normal
                                User</span>
                        </div>

                        <hr class="border-secondary opacity-25 mb-4">

                        <nav>
                            <a th:href="@{/user/dashboard}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-grid-1x2-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M0 1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1zm9 0a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V1zm0 9a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5z" />
                                </svg>Dashboard
                            </a>
                            <a th:href="@{/user/show_contacts/0}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-people-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7Zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-5.784 6A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216ZM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
                                </svg>
                                View Contacts
                            </a>

                            <a th:href="@{/user/add_contact}" class="sidebar-link active">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-person-plus-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                                    <path fill-rule="evenodd"
                                        d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z" />
                                </svg>
                                Add Contact
                            </a>

                            <a th:href="@{/user/profile}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-person-circle" viewBox="0 0 16 16">
                                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                                    <path fill-rule="evenodd"
                                        d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z" />
                                </svg>
                                Your Profile
                            </a>
                        </nav>
                    </div>
                </div>

                <div class="col-lg-9 col-xl-10 mt-4 mt-lg-0">

                    <div class="glass-card p-4 p-md-5 border-top-neon shadow-lg">

                        <div class="text-center mb-5">
                            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="var(--neon-blue)"
                                class="bi bi-person-plus-fill mb-3" viewBox="0 0 16 16">
                                <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                                <path fill-rule="evenodd"
                                    d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z" />
                            </svg>
                            <h2 class="fw-bold text-white">Add New <span class="text-neon">Contact</span></h2>
                            <p class="text-light-muted">Fill out the details below to add a new person to your network.
                            </p>
                        </div>

                        <div class="alert glass-alert-success d-flex align-items-center" role="alert"
                            th:if="${message != null and message.type == 'alert-success'}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-check-circle-fill me-3 flex-shrink-0" viewBox="0 0 16 16">
                                <path
                                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
                            </svg>
                            <span th:text="${message.content}"></span>
                        </div>

                        <div class="alert glass-alert-danger d-flex align-items-center" role="alert"
                            th:if="${message != null and message.type == 'alert-danger'}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-exclamation-triangle-fill me-3 flex-shrink-0" viewBox="0 0 16 16">
                                <path
                                    d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
                            </svg>
                            <span th:text="${message.content}"></span>
                        </div>

                        <form th:action="@{/user/process-contact}" th:object="${contact}" method="post"
                            enctype="multipart/form-data">

                            <input type="hidden" th:field="*{cId}">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label for="name_field" class="form-label">Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text glass-addon">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                                fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                                                <path
                                                    d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4Zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10Z" />
                                            </svg>
                                        </span>
                                        <input type="text" class="form-control glass-input" id="name_field" name="name"
                                            placeholder="Enter full name" required th:value="*{name}"
                                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                    </div>
                                    <span class="text-neon-red" th:if="${#fields.hasErrors('name')}"
                                        th:errors="*{name}"></span>
                                </div>

                                <div class="col-md-6">
                                    <label for="nickname_field" class="form-label">Nickname</label>
                                    <div class="input-group">
                                        <span class="input-group-text glass-addon">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                                fill="currentColor" class="bi bi-tag" viewBox="0 0 16 16">
                                                <path
                                                    d="M6 4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-1 0a.5.5 0 1 0-1 0 .5.5 0 0 0 1 0z" />
                                                <path
                                                    d="M2 1h4.586a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0l-7-7A1 1 0 0 1 1 6.586V2a1 1 0 0 1 1-1zm0 5.586 7 7L13.586 9l-7-7H2v4.586z" />
                                            </svg>
                                        </span>
                                        <input type="text" class="form-control glass-input" id="nickname_field"
                                            name="nickname" placeholder="Enter nickname" th:value="*{nickname}">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="email_field" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text glass-addon">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                                fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
                                                <path
                                                    d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z" />
                                            </svg>
                                        </span>
                                        <input type="email" class="form-control glass-input" id="email_field"
                                            name="email" placeholder="name@example.com" th:value="*{email}">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="phone_field" class="form-label">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text glass-addon">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                                fill="currentColor" class="bi bi-telephone" viewBox="0 0 16 16">
                                                <path
                                                    d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122l-2.19.547a1.745 1.745 0 0 1-1.657-.459L5.482 8.062a1.745 1.745 0 0 1-.46-1.657l.548-2.19a.678.678 0 0 0-.122-.58L3.654 1.328zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.678.678 0 0 0 .178.643l2.457 2.457a.678.678 0 0 0 .644.178l2.189-.547a1.745 1.745 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.634 18.634 0 0 1-7.01-4.42 18.634 18.634 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z" />
                                            </svg>
                                        </span>
                                        <input type="tel" class="form-control glass-input" id="phone_field" name="phone"
                                            placeholder="+1 (555) 000-0000" required th:value="*{phone}"
                                            th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                                        <span class="text-neon-red" th:if="${#fields.hasErrors('phone')}"
                                            th:errors="*{phone}"></span>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label for="work_field" class="form-label">Work / Company</label>
                                    <div class="input-group">
                                        <span class="input-group-text glass-addon">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                                fill="currentColor" class="bi bi-briefcase" viewBox="0 0 16 16">
                                                <path
                                                    d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1h-3zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5zm1.886 6.914L15 7.151V12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V7.15l6.614 1.764a1.5 1.5 0 0 0 .772 0zM1.5 4h13a.5.5 0 0 1 .5.5v1.616L8.129 7.948a.5.5 0 0 1-.258 0L1 6.116V4.5a.5.5 0 0 1 .5-.5z" />
                                            </svg>
                                        </span>
                                        <input type="text" class="form-control glass-input" id="work_field" name="work"
                                            placeholder="Job title or Company name" th:value="*{work}">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label for="description_field" class="form-label">Description</label>
                                    <div class="input-group">
                                        <span class="input-group-text glass-addon align-items-start pt-3">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                                fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                                                <path
                                                    d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                                                <path fill-rule="evenodd"
                                                    d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z" />
                                            </svg>
                                        </span>
                                        <textarea class="form-control glass-input" id="description_field"
                                            name="description" rows="5"
                                            placeholder="Enter any notes or description about this contact..."
                                            th:text="*{description}"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <label for="image_field" class="form-label">Profile Picture (Optional)</label>
                                <div class="input-group">
                                    <span class="input-group-text glass-addon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                            fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                                            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
                                            <path
                                                d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z" />
                                        </svg>
                                    </span>
                                    <input type="file" class="form-control glass-input" id="image_field"
                                        name="profileImage" accept="image/jpeg,image/png,image/gif">
                                </div>
                            </div>

                            <div class="mt-5 text-center">
                                <button type="submit"
                                    class="btn btn-neon px-5 py-3 fw-bold fs-6 text-uppercase tracking-wide">
                                    Save Contact
                                </button>
                                <button type="reset" class="btn btn-outline-secondary px-4 py-3 ms-3 fw-bold border-0">
                                    Clear
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
