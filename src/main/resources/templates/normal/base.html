<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="Layout(content)">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <title>Base Page</title>
</head>

<body class="dark-theme">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand text-neon fw-bold" href="#">Smart Contact Manager</a>
            <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto text-uppercase align-items-center">
                    <li class="nav-item">
                        <a class="nav-link hover-neon" th:href="@{/}">Home</a>
                    </li>

                    <li class="nav-item">
                        <span class="nav-link hover-neon" th:text="${user.name}">User</span>
                    </li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                class="nav-link btn btn-neon text-dark fw-bold px-4 py-2">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="relative-z container my-5">
        <div th:replace="${content}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script>

        function deleteContact(cId) {
            swal({
                title: "Are you sure?",
                text: "You want to delete this contact..!",
                icon: "warning",
                buttons: true,
                dangerMode: true,
                className: "glass-theme"
            })
                .then((willDelete) => {
                    if (willDelete) {
                        submitCsrfPost("/user/delete/" + cId);
                    } else {
                        swal({
                            text: "Your contact is safe..!",
                            icon: "info",
                            className: "glass-theme"
                        });
                    }
                });
        }

        function deleteUser(id) {
            swal({
                title: "Are you sure?",
                text: "You want to delete your account..!",
                icon: "warning",
                buttons: true,
                dangerMode: true,
                className: "glass-theme"
            })
                .then((willDelete) => {
                    if (willDelete) {
                        submitCsrfPost("/user/profile/delete/" + id);
                    } else {
                        swal({
                            text: "Your account is safe..!",
                            icon: "info",
                            className: "glass-theme"
                        });
                    }
                });
        }

        function submitCsrfPost(url) {
            const csrfMeta = document.querySelector('meta[name="_csrf"]');
            if (!csrfMeta) {
                swal("Unable to complete request", "Refresh the page and try again.", "error");
                return;
            }

            const form = document.createElement("form");
            form.method = "post";
            form.action = url;
            const csrfInput = document.createElement("input");
            csrfInput.type = "hidden";
            csrfInput.name = "_csrf";
            csrfInput.value = csrfMeta.content;
            form.appendChild(csrfInput);
            document.body.appendChild(form);
            form.submit();
        }

    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
