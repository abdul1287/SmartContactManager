<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/base :: Layout(~{::section})">

<head>
    <meta charset="UTF-8">
    <title>View Contacts - Smart Contact Manager</title>
</head>

<body>
    <section class="view-contacts-section py-4 relative-z">

        <style>
            /* Sidebar Styles */
            .glass-sidebar {
                background: rgba(10, 11, 16, 0.4) !important;
                border-right: 1px solid rgba(0, 229, 255, 0.1);
                border-radius: 16px;
                backdrop-filter: blur(10px);
            }

            .sidebar-link {
                color: #a0a5b5;
                padding: 12px 20px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                gap: 15px;
                transition: all 0.3s ease;
                text-decoration: none;
                font-weight: 500;
                margin-bottom: 8px;
            }

            .sidebar-link:hover,
            .sidebar-link.active {
                background: rgba(0, 229, 255, 0.1);
                color: #00E5FF;
                border-left: 4px solid #00E5FF;
            }

            /* Table Styles */
            .glass-table {
                color: #cbd5e1;
            }

            .glass-table th {
                border-bottom: 1px solid rgba(0, 229, 255, 0.2) !important;
                color: #00E5FF;
                font-weight: 600;
                text-transform: uppercase;
                font-size: 0.85rem;
                letter-spacing: 1px;
                padding: 15px;
            }

            .glass-table td {
                border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
                vertical-align: middle;
                padding: 15px;
            }

            .glass-table tbody tr {
                transition: background 0.3s ease;
            }

            .glass-table tbody tr:hover {
                background: rgba(255, 255, 255, 0.03);
            }

            /* Table Action Buttons */
            .btn-neon-action {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 6px 12px;
                border-radius: 6px;
                transition: all 0.3s ease;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .btn-neon-action.edit-btn {
                color: #00E5FF;
            }

            .btn-neon-action.edit-btn:hover {
                background: rgba(0, 229, 255, 0.1);
                border-color: #00E5FF;
                box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
            }

            .btn-neon-action.delete-btn {
                color: #ff3366;
                /* Neon Red */
            }

            .btn-neon-action.delete-btn:hover {
                background: rgba(255, 51, 102, 0.1);
                border-color: #ff3366;
                box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
            }

            /* Neon Green View Button */
            .btn-neon-action.view-btn {
                color: #00E676;
            }

            .btn-neon-action.view-btn:hover {
                background: rgba(0, 230, 118, 0.1);
                border-color: #00E676;
                box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
            }

            /* Glassmorphism Pagination Styles */
            .glass-pagination {
                justify-content: center;
                gap: 8px;
                /* Creates space between the buttons */
            }

            .glass-pagination .page-item .page-link {
                background: rgba(255, 255, 255, 0.03) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                color: #a0a5b5;
                border-radius: 8px !important;
                /* Forces rounded corners on all buttons */
                padding: 8px 16px;
                font-weight: 500;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: none !important;
            }

            /* Hover State */
            .glass-pagination .page-item .page-link:hover {
                background: rgba(0, 229, 255, 0.15) !important;
                color: #00E5FF !important;
                border-color: rgba(0, 229, 255, 0.4) !important;
                box-shadow: 0 0 10px rgba(0, 229, 255, 0.2) !important;
                transform: translateY(-2px);
            }

            /* Active Current Page State */
            .glass-pagination .page-item.active .page-link {
                background: #00E5FF !important;
                color: #0a0b10 !important;
                /* Dark text for contrast */
                border-color: #00E5FF !important;
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.5) !important;
            }

            /* Disabled State (For Previous/Next when at the end) */
            .glass-pagination .page-item.disabled .page-link {
                background: rgba(255, 255, 255, 0.01) !important;
                color: rgba(160, 165, 181, 0.3) !important;
                border-color: rgba(255, 255, 255, 0.05) !important;
                cursor: not-allowed;
                transform: none;
            }

            /* Table Contact Profile Image */
            .contact-profile-img {
                width: 45px;
                height: 45px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid rgba(0, 229, 255, 0.5);
                box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
                background-color: #1a1d24;
                /* Dark fallback background */
                padding: 2px;
                /* Slight padding to create a gap between the image and the glowing border */
            }

            /* Neon Green Success Alert Styling */
            .glass-alert-success {
                background: rgba(0, 230, 118, 0.1) !important;
                /* Deep transparent green */
                border: 1px solid rgba(0, 230, 118, 0.4) !important;
                color: #00E676 !important;
                /* Neon green text */
                box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
                backdrop-filter: blur(10px);
                border-radius: 8px;
                font-weight: 500;
            }

            /* SweetAlert 1 Glassmorphism Theme */
            .glass-theme {
                background: rgba(15, 17, 26, 0.95) !important;
                border: 1px solid rgba(0, 229, 255, 0.2) !important;
                border-top: 3px solid #00E5FF !important;
                border-radius: 16px !important;
                backdrop-filter: blur(15px) !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.1) !important;
            }

            /* Fix Text Colors */
            .glass-theme .swal-title {
                color: #ffffff !important;
            }

            .glass-theme .swal-text {
                color: #a0a5b5 !important;
            }

            /* Style the Cancel Button */
            .glass-theme .swal-button--cancel {
                background: transparent !important;
                color: #a0a5b5 !important;
                border: 1px solid rgba(255, 255, 255, 0.2) !important;
                transition: all 0.3s ease;
            }

            .glass-theme .swal-button--cancel:hover {
                background: rgba(255, 255, 255, 0.05) !important;
                color: #ffffff !important;
            }

            /* Style the Delete (Danger) Button */
            .glass-theme .swal-button--danger {
                background: rgba(255, 51, 102, 0.15) !important;
                color: #ff3366 !important;
                border: 1px solid rgba(255, 51, 102, 0.4) !important;
                transition: all 0.3s ease;
            }

            .glass-theme .swal-button--danger:hover {
                background: #ff3366 !important;
                color: #ffffff !important;
                box-shadow: 0 0 15px rgba(255, 51, 102, 0.6) !important;
            }

            /* Style the OK (Normal) Button */
            .glass-theme .swal-button--confirm:not(.swal-button--danger) {
                background: rgba(0, 229, 255, 0.15) !important;
                color: #00E5FF !important;
                border: 1px solid rgba(0, 229, 255, 0.4) !important;
                transition: all 0.3s ease;
            }

            .glass-theme .swal-button--confirm:not(.swal-button--danger):hover {
                background: #00E5FF !important;
                color: #0a0b10 !important;
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.6) !important;
            }

            /* Fix Icon background circle for dark mode */
            .glass-theme .swal-icon--warning {
                border-color: #ff3366 !important;
            }

            .glass-theme .swal-icon--warning__body,
            .glass-theme .swal-icon--warning__dot {
                background-color: #ff3366 !important;
            }

            /* Glassmorphism Search Bar */
            .glass-search-addon {
                background: rgba(0, 229, 255, 0.05) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                border-right: none !important;
                color: #00E5FF !important;
                display: flex;
                align-items: center;
                padding: 0 18px;
                border-top-left-radius: 8px;
                border-bottom-left-radius: 8px;
                transition: all 0.3s ease;
            }

            .glass-search-input {
                background: rgba(255, 255, 255, 0.03) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                border-left: none !important;
                color: #ffffff !important;
                padding: 12px 15px;
                border-top-right-radius: 8px;
                border-bottom-right-radius: 8px;
                transition: all 0.3s ease;
            }

            .glass-search-input::placeholder {
                color: #6c757d;
            }

            .glass-search-input:focus {
                background: rgba(255, 255, 255, 0.06) !important;
                outline: none;
                box-shadow: none !important;
            }

            /* Make both the icon and input glow together when focused */
            .search-container:focus-within .glass-search-addon,
            .search-container:focus-within .glass-search-input {
                border-color: #00E5FF !important;
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.2) !important;
            }

            .search-container:focus-within .glass-search-addon {
                background: rgba(0, 229, 255, 0.1) !important;
            }

            /* Search Result Dropdown Container */
            .search-result {
                background: #0f111a !important;
                /* Forces dark background */
                border: 1px solid rgba(0, 229, 255, 0.4) !important;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 229, 255, 0.15) !important;
                overflow: hidden;
                margin-top: 8px !important;
                /* Adds a clean gap below the search bar */
                padding: 0 !important;
            }

            /* Strips out any default white backgrounds from inner list elements */
            .search-result * {
                background: transparent !important;
            }

            /* Individual Search Result Links */
            .search-result a {
                color: #cbd5e1 !important;
                padding: 12px 20px;
                display: block;
                text-decoration: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-weight: 500;
                transition: all 0.2s ease;
                border-left: 3px solid transparent;
                /* Placeholder for hover effect */
            }

            /* Remove border from the last item */
            .search-result a:last-child {
                border-bottom: none;
            }

            /* Premium Hover Effect - Matches Sidebar */
            .search-result a:hover {
                background: rgba(0, 229, 255, 0.08) !important;
                color: #00E5FF !important;
                border-left: 3px solid #00E5FF !important;
                /* Glowing left indicator */
                padding-left: 24px;
                /* Slight push animation */
            }

            /* Profile Hero Image */
            .profile-hero-img {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid rgba(0, 229, 255, 0.6);
                box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
                background-color: #1a1d24;
                padding: 4px;
                margin: 0 auto;
            }
        </style>

        <div class="container-fluid px-lg-5">
            <div class="row g-4">

                <div class="col-lg-3 col-xl-2">
                    <div class="glass-sidebar p-3 h-100 min-vh-100">
                        <div class="text-center mb-4 pt-3">
                            <div class="rounded-circle bg-dark d-inline-flex align-items-center justify-content-center border border-info mb-3"
                                style="width: 80px; height: 80px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);"
                                th:if="${#strings.isEmpty(user.imageUrl)}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="var(--neon-blue)"
                                    class="bi bi-person-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                                </svg>
                            </div>
                            <img th:unless="${#strings.isEmpty(user.imageUrl)}" th:src="@{'/img/' + ${user.imageUrl}}"
                                alt="Profile Image" class="profile-hero-img" />
                            <h5 class="text-white fw-bold mb-1" th:text="${user.name}" style="padding-top: 4px;">User
                                Name</h5>
                            <p class="text-light-muted text-sm mb-2" style="font-size: 0.8rem;" th:text="${user.email}">
                                user@example.com</p>
                            <span class="badge badge-glass"
                                style="background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); color: var(--neon-blue); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem;">Normal
                                User</span>
                        </div>

                        <hr class="border-secondary opacity-25 mb-4">

                        <nav>
                            <a th:href="@{/user/dashboard}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-grid-1x2-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M0 1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1zm9 0a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V1zm0 9a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5z" />
                                </svg>
                                Dashboard
                            </a>

                            <a th:href="@{/user/show_contacts/0}" class="sidebar-link active">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-people-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7Zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-5.784 6A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216ZM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
                                </svg>
                                View Contacts
                            </a>

                            <a th:href="@{/user/add_contact}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-person-plus-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                                    <path fill-rule="evenodd"
                                        d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z" />
                                </svg>
                                Add Contact
                            </a>

                            <a th:href="@{/user/profile}" class="sidebar-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                                    class="bi bi-person-circle" viewBox="0 0 16 16">
                                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                                    <path fill-rule="evenodd"
                                        d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z" />
                                </svg>
                                Your Profile
                            </a>
                        </nav>
                    </div>
                </div>

                <div class="col-lg-9 col-xl-10 mt-4 mt-lg-0">

                    <div class="glass-card p-4 p-md-5 border-top-neon shadow-lg">

                        <div class="text-center mb-5">
                            <h2 class="fw-bold text-white">Your <span class="text-neon">Contacts</span></h2>
                            <p class="text-light-muted">View and manage your entire network below.</p>
                        </div>

                        <div class="row justify-content-center mb-5">
                            <div class="col-md-10 col-lg-8">
                                <div class="input-group search-container position-relative">
                                    <span class="input-group-text glass-search-addon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                            fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                            <path
                                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                                        </svg>
                                    </span>
                                    <input onkeyup="search()" type="text" id="search-input"
                                        class="form-control glass-search-input"
                                        placeholder="Search by name, email, or phone number..." autocomplete="off">

                                    <div class="search-result position-absolute w-100"
                                        style="top: 110%; z-index: 1000;">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="alert glass-alert-success d-flex align-items-center" role="alert"
                            th:if="${message != null and message.type == 'alert-success'}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-check-circle-fill me-3 flex-shrink-0" viewBox="0 0 16 16">
                                <path
                                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
                            </svg>
                            <span th:text="${message.content}"></span>
                        </div>

                        <div class="table-responsive">
                            <table class="table glass-table table-borderless mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${contacts.empty}">
                                        <td colspan="5" class="text-center py-5 text-light-muted">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"
                                                fill="currentColor" class="bi bi-inbox mb-3 opacity-50"
                                                viewBox="0 0 16 16">
                                                <path
                                                    d="M4.98 4a.5.5 0 0 0-.39.188L1.54 8H6a.5.5 0 0 1 .5.5 1.5 1.5 0 1 0 3 0A.5.5 0 0 1 10 8h4.46l-3.05-3.812A.5.5 0 0 0 11.02 4H4.98zm-1.17-.437A1.5 1.5 0 0 1 4.98 3h6.04a1.5 1.5 0 0 1 1.17.563l3.7 4.625A.5.5 0 0 1 16 8.5V13a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V8.5a.5.5 0 0 1 .19-.312l3.7-4.625zM1 8.5v4.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5H11a2.5 2.5 0 1 1-5 0H1z" />
                                            </svg>
                                            <p class="mb-0 fs-5">You haven't added any contacts yet.</p>
                                        </td>
                                    </tr>
                                    <tr th:unless="${contacts.empty}" th:each="contact : ${contacts}">
                                        <td th:text="${'SCM2026' + contact.cId}"></td>
                                        <td>
                                            <div class="d-flex align-items-center gap-3">

                                                <div th:if="${contact.image == 'default.png'}"
                                                    class="rounded-circle d-inline-flex align-items-center justify-content-center"
                                                    style="width: 45px; height: 45px; background-color: #1a1d24; border: 2px solid rgba(0, 229, 255, 0.5); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                        fill="#00E5FF" class="bi bi-person-fill" viewBox="0 0 16 16">
                                                        <path
                                                            d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                                                    </svg>
                                                </div>

                                                <img th:unless="${contact.image == 'default.png'}"
                                                    th:src="@{'/img/' + ${contact.image}}" alt="profile photo"
                                                    class="contact-profile-img" />

                                                <span class="fw-bold text-white" th:text="${contact.name}"></span>
                                            </div>
                                        </td>

                                        <td th:text="${contact.email}"></td>
                                        <td th:text="${contact.phone}"></td>
                                        <td>
                                            <div class="d-flex gap-2">
                                                <a th:href="@{'/user/contact/'+${contact.cId}}"
                                                    class="btn-neon-action view-btn" title="View Contact">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                        fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                                                        <path
                                                            d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z" />
                                                        <path
                                                            d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z" />
                                                    </svg>
                                                </a>
                                                <a th:href="@{'/user/update-contact/'+${contact.cId}}"
                                                    class="btn-neon-action edit-btn" title="Edit Contact">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                        fill="currentColor" class="bi bi-pencil-square"
                                                        viewBox="0 0 16 16">
                                                        <path
                                                            d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                                                        <path fill-rule="evenodd"
                                                            d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z" />
                                                    </svg>
                                                </a>

                                                <a class="btn-neon-action delete-btn" title="Delete Contact"
                                                    th:onclick="|deleteContact(${contact.cId})|">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                        fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                                                        <path
                                                            d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-.5a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .471-.53Zm5.058 0a.5.5 0 0 1 .471.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47ZM8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5Z" />
                                                    </svg>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- Pagination part -->
                            <nav aria-label="Page navigation" class="mt-5 mb-3" th:if="${totalPages > 0}">

                                <ul class="pagination glass-pagination">

                                    <li class="page-item" th:if="${currentPage != 0}">
                                        <a class="page-link" th:href="@{'/user/show_contacts/' + ${currentPage - 1}}">
                                            Previous
                                        </a>
                                    </li>

                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${i == currentPage} ? 'active'">

                                        <a class="page-link" th:href="@{'/user/show_contacts/' + ${i}}">
                                            <span th:text="${i + 1}"></span>
                                        </a>

                                    </li>

                                    <li class="page-item" th:if="${currentPage != totalPages - 1}">
                                        <a class="page-link" th:href="@{'/user/show_contacts/' + ${currentPage + 1}}">
                                            Next
                                        </a>
                                    </li>

                                </ul>

                            </nav>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
